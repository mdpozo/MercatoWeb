<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión | Mercato</title>
  <meta name="description" content="Inicia sesión en tu cuenta de Mercato.">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* Estilos específicos mínimos para ocultar la navegación en login */
    .login-header {
      background: var(--dark);
      padding: 1rem;
      display: flex;
      justify-content: center;
      border-bottom: 1px solid var(--border);
    }
    .login-footer {
      text-align: center;
      padding: 2rem 1rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: auto;
    }
    .login-footer a {
      margin: 0 10px;
    }
  </style>
</head>

<body>

  <header class="login-header">
    <a href="index.html" class="logo" style="margin:0;">Merca<span>to</span></a>
  </header>

  <main class="login-page">
    <div class="login-card">
      <h1>Iniciar sesión</h1>
      <form id="login-form">
        <div class="form-group">
          <label for="email">Dirección de e-mail</label>
          <input type="email" id="email" required autofocus>
        </div>
        
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required>
        </div>
        
        <button type="submit" class="btn btn-primary">Continuar</button>
      </form>
      
      <div style="margin-top: 1rem; font-size: 0.85rem;">
        <p>Al identificarte, aceptas nuestras <a href="#">Condiciones de uso y venta</a> y nuestro <a href="#">Aviso de privacidad</a>.</p>
        <p style="margin-top: 0.5rem;"><a href="#">¿Has olvidado la contraseña?</a></p>
      </div>
    </div>
    
    <div style="width:100%; max-width:400px;">
      <div class="login-divider">¿Eres nuevo en Mercato?</div>
      <a href="#" class="btn-secondary">Crea tu cuenta de Mercato</a>
    </div>
  </main>

  <footer class="login-footer">
    <div style="margin-bottom: 10px;">
      <a href="#">Condiciones de uso</a>
      <a href="#">Aviso de privacidad</a>
      <a href="contacto.html">Ayuda</a>
    </div>
    <p>&copy; 2026 Mercato S.L. Todos los derechos reservados.</p>
  </footer>

  <script src="js/main.js"></script>
</body>

</html>
